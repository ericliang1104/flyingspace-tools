<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLYINGSPACE 商案控制台</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap');

:root{
  --bg:#141318;
  --surface:#1E1C23;
  --surface2:#28252E;
  --line: rgba(255,255,255,0.09);
  --accent:#E8622C;
  --accent-soft: rgba(232,98,44,0.16);
  --cyan:#3FC7D6;
  --cyan-soft: rgba(63,199,214,0.14);
  --danger:#E2504F;
  --danger-soft: rgba(226,80,79,0.14);
  --text:#F4F0E8;
  --dim:#9A94A3;
  --dim2:#6E6878;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Inter',ui-sans-serif,system-ui,sans-serif;
  min-height:100vh;
}
.mono{font-family:'JetBrains Mono',monospace;}
.wrap{max-width:1180px; margin:0 auto; padding:28px 22px 80px;}

/* header */
header{display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:16px; margin-bottom:28px; border-bottom:1px solid var(--line); padding-bottom:20px;}
.brand{display:flex; align-items:baseline; gap:12px;}
.brand h1{font-family:'Archivo Black',sans-serif; font-size:26px; letter-spacing:0.5px; margin:0; text-transform:uppercase;}
.brand span{color:var(--accent);}
.brand .sub{color:var(--dim); font-size:12px; font-family:'JetBrains Mono',monospace; letter-spacing:1px; text-transform:uppercase;}
.headbtns{display:flex; gap:10px;}
button{font-family:inherit; cursor:pointer;}
.btn{background:var(--surface2); border:1px solid var(--line); color:var(--text); padding:10px 16px; border-radius:8px; font-size:14px; font-weight:600; transition:.15s;}
.btn:hover{border-color:var(--accent); color:var(--accent);}
.btn-primary{background:var(--accent); border:1px solid var(--accent); color:#1a0e08; font-weight:800;}
.btn-primary:hover{filter:brightness(1.08); color:#1a0e08;}
.btn-ghost{background:transparent; border:1px solid var(--line); color:var(--dim);}
.btn-ghost:hover{color:var(--text); border-color:var(--text);}

/* filters */
.filters{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:22px; align-items:center;}
.filters input[type=text]{flex:1; min-width:180px; background:var(--surface); border:1px solid var(--line); color:var(--text); padding:10px 14px; border-radius:8px; font-size:14px;}
.filters select{background:var(--surface); border:1px solid var(--line); color:var(--text); padding:10px 12px; border-radius:8px; font-size:14px;}

/* view toggle */
.view-toggle{display:flex; gap:3px; background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:3px; flex-shrink:0;}
.view-toggle button{background:none; border:none; color:var(--dim); padding:8px 14px; border-radius:7px; font-size:13px; font-weight:700;}
.view-toggle button.active{background:var(--accent); color:#1a0e08;}
.view-toggle button:not(.active):hover{color:var(--text);}

/* list view */
.list-wrap{overflow:auto; max-height:72vh; border:1px solid var(--line); border-radius:12px;}
.list-wrap table{width:100%; border-collapse:collapse; font-size:13px; min-width:1040px;}
.list-wrap th{position:sticky; top:0; background:#2E2A35; color:var(--dim); font-size:11.5px; text-transform:uppercase; letter-spacing:0.5px; padding:11px 12px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap; z-index:2;}
.list-wrap td{padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:middle;}
.list-wrap tbody tr:hover{background:var(--accent-soft);}
.list-wrap td[contenteditable=true]{outline:none; min-width:70px;}
.list-wrap td[contenteditable=true]:focus{background:var(--surface2); box-shadow:inset 0 0 0 1px var(--accent);}
.list-wrap td.num{font-family:'JetBrains Mono',monospace; color:var(--dim); text-align:center;}
.list-wrap td.dancer-col{color:var(--dim); max-width:230px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.list-wrap td.title-col{font-weight:700; min-width:150px;}
select.stamp{appearance:none; -webkit-appearance:none; cursor:pointer; transform:none; padding:5px 22px 5px 9px; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='%239A94A3'><path d='M5.5 7.5l4.5 4.5 4.5-4.5z'/></svg>"); background-repeat:no-repeat; background-position:right 6px center; background-size:14px;}
select.stamp:focus{outline:2px solid currentColor;}
.detail-link{background:none; border:1px solid var(--line); color:var(--dim); padding:6px 11px; border-radius:6px; font-size:12px; font-weight:600; white-space:nowrap;}
.detail-link:hover{color:var(--accent); border-color:var(--accent);}
.list-empty{text-align:center; padding:60px 20px; color:var(--dim);}
.list-empty b{color:var(--text); display:block; margin-bottom:6px; font-size:16px;}

/* grid */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px;}
.card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:18px; position:relative; overflow:hidden; transition:.15s; display:flex; flex-direction:column; gap:10px;}
.card:hover{border-color:var(--accent); transform:translateY(-2px);}
.card-check{position:absolute; top:12px; right:12px; z-index:5; cursor:pointer;}
.card-check input{width:18px; height:18px; accent-color:var(--accent); cursor:pointer;}
.bulk-bar{display:none; align-items:center; gap:12px; background:var(--surface2); border:1px solid var(--accent); border-radius:10px; padding:10px 16px; margin-bottom:16px; flex-wrap:wrap;}
.bulk-bar span{font-size:13.5px; font-weight:700; color:var(--accent);}
.bulk-bar select{background:var(--bg); border:1px solid var(--line); color:var(--text); padding:7px 10px; border-radius:7px; font-size:13px;}
.card .top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
.card h3{margin:0; font-size:17px; font-weight:800; line-height:1.3;}
.stamp{font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:700; letter-spacing:1px; padding:4px 9px; border-radius:20px; white-space:nowrap; text-transform:uppercase; transform:rotate(-2deg); border:1px solid currentColor;}
.st-done{color:var(--cyan); background:var(--cyan-soft);}
.st-ready{color:var(--accent); background:var(--accent-soft);}
.st-pending{color:var(--dim); background:var(--surface2); border-style:dashed;}
.st-cancel{color:var(--danger); background:var(--danger-soft);}
.card .meta{color:var(--dim); font-size:13px; display:flex; flex-direction:column; gap:4px;}
.card .meta b{color:var(--text); font-weight:600;}
.card .stats{display:flex; gap:14px; font-size:12px; color:var(--dim2); margin-top:auto; padding-top:10px; border-top:1px solid var(--line); font-family:'JetBrains Mono',monospace;}
.card .stats em{color:var(--text); font-style:normal; font-weight:700;}
.empty{grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--dim); border:1px dashed var(--line); border-radius:12px;}
.empty b{color:var(--text); display:block; margin-bottom:6px; font-size:16px;}

/* overlay + modal */
.overlay{position:fixed; inset:0; background:rgba(10,9,12,0.72); backdrop-filter:blur(3px); display:none; align-items:flex-start; justify-content:center; z-index:50; padding:40px 16px; overflow-y:auto;}
.overlay.show{display:flex;}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:14px; width:100%; max-width:880px; padding:26px 26px 30px; margin-bottom:40px;}
.panel-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;}
.panel-head h2{margin:0; font-family:'Archivo Black',sans-serif; font-size:19px; text-transform:uppercase;}
.close{background:none; border:none; color:var(--dim); font-size:22px; line-height:1;}
.close:hover{color:var(--accent);}

/* quick add */
textarea{width:100%; min-height:220px; background:var(--bg); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:14px; font-family:'JetBrains Mono',monospace; font-size:13px; line-height:1.6; resize:vertical;}
.hint{color:var(--dim2); font-size:12px; margin:8px 0 16px; line-height:1.6;}
.actions{display:flex; gap:10px; justify-content:flex-end; margin-top:16px;}
.status-line{font-size:13px; color:var(--dim); margin-top:10px; min-height:18px;}
.status-line.err{color:var(--danger);}
.status-line.ok{color:var(--cyan);}
.checkline{display:flex; align-items:center; gap:9px; font-size:13.5px; color:var(--text); margin:10px 0; cursor:pointer;}
.checkline input{width:16px; height:16px; accent-color:var(--accent); cursor:pointer;}

/* detail sections */
.sec{margin-top:22px;}
.sec-title{font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--accent); background:var(--accent-soft); display:inline-block; padding:5px 10px; border-radius:5px; margin-bottom:10px; font-weight:700;}
table{width:100%; border-collapse:collapse; font-size:13.5px;}
th,td{border:1px solid var(--line); padding:8px 10px; text-align:left; vertical-align:top;}
th{color:var(--dim); font-weight:600; background:var(--surface2); font-size:12px;}
td[contenteditable=true], th[contenteditable=true]{outline:none;}
td[contenteditable=true]:focus{background:var(--accent-soft);}
.row-add{margin-top:8px; font-size:12px; color:var(--dim); background:none; border:1px dashed var(--line); border-radius:6px; padding:6px 10px;}
.row-add:hover{color:var(--accent); border-color:var(--accent);}
.top-fields{display:grid; grid-template-columns:repeat(4,1fr); gap:10px 14px;}
.field{display:flex; flex-direction:column; gap:4px;}
.field label{font-size:11px; color:var(--dim2); font-family:'JetBrains Mono',monospace; text-transform:uppercase; letter-spacing:0.5px;}
.field input, .field select{background:var(--bg); border:1px solid var(--line); color:var(--text); padding:8px 10px; border-radius:6px; font-size:13.5px;}
.rm-btn{color:var(--danger); background:none; border:none; font-size:16px; padding:0 4px;}
.rm-btn:hover{opacity:0.7;}
@media(max-width:640px){.top-fields{grid-template-columns:repeat(2,1fr);} table, th, td{font-size:12px;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>FLYING<span>SPACE</span></h1>
      <div class="sub">商案控制台 · Project Console</div>
    </div>
    <div class="headbtns">
      <button class="btn" id="btnExport">📊 匯出 Excel</button>
      <button class="btn" id="btnQuick">✨ 貼上備忘錄快速解析</button>
      <button class="btn btn-primary" id="btnNew">+ 手動新增商案</button>
    </div>
  </header>

  <div class="filters">
    <div class="view-toggle">
      <button class="active" id="viewCardsBtn">卡片檢視</button>
      <button id="viewListBtn">總覽列表</button>
    </div>
    <input type="text" id="searchBox" placeholder="搜尋商案名稱、客戶、地點、舞者...">
    <select id="statusFilter">
      <option value="">全部狀態</option>
      <option value="籌備中">籌備中</option>
      <option value="估價中">估價中</option>
      <option value="已確認">已確認</option>
      <option value="已演出">已演出</option>
      <option value="已寄發票">已寄發票</option>
      <option value="已入帳">已入帳</option>
      <option value="已請款">已請款</option>
      <option value="已結案">已結案</option>
      <option value="已取消">已取消</option>
    </select>
    <select id="clientFilter"><option value="">全部客戶</option></select>
    <select id="yearFilter"><option value="">全部年份</option></select>
    <select id="monthFilter"><option value="">全部月份</option></select>
  </div>

  <div class="bulk-bar" id="bulkBar" style="display:none;">
    <span id="bulkCount"></span>
    <select id="bulkStatusSelect"></select>
    <button class="btn" id="bulkApplyStatus">套用狀態</button>
    <button class="btn btn-ghost" id="bulkDeleteBtn">刪除所選</button>
    <button class="btn btn-ghost" id="bulkClear">取消選取</button>
  </div>

  <div class="grid" id="grid"></div>
  <div class="list-wrap" id="listWrap" style="display:none;">
    <table>
      <thead><tr>
        <th style="width:34px;"><input type="checkbox" id="selectAllList"></th>
        <th>商演名稱</th><th>狀態</th><th>演出地點</th><th>活動日期</th><th>預留日期</th><th>客戶</th><th>人數</th><th>演出舞者</th><th>演出服裝樣式</th><th></th>
      </tr></thead>
      <tbody id="listBody"></tbody>
    </table>
  </div>
</div>

<!-- Quick add overlay -->
<div class="overlay" id="quickOverlay">
  <div class="panel">
    <div class="panel-head">
      <h2>✨ 備忘錄快速解析</h2>
      <button class="close" data-close="quickOverlay">×</button>
    </div>
    <div class="hint">直接貼上你原本記在備忘錄裡的商案內容（可一次貼多筆，用 ✨ 開頭分隔），會照你固定的格式（舞者：、曲目：、日期時間等）自動拆解成結構化商案卡片，不需要網路連線。解析完成後可再手動確認調整。</div>
    <textarea id="quickText" placeholder="✨6/13 延吉商演&#10;（需預留6/11-6/14）-提早一天去程&#10;舞者：林宜欣、吳岱凌...&#10;..."></textarea>
    <div class="status-line" id="quickStatus"></div>
    <div class="actions">
      <button class="btn btn-ghost" data-close="quickOverlay">取消</button>
      <button class="btn btn-primary" id="btnParse">開始解析</button>
    </div>
  </div>
</div>

<!-- Detail overlay -->
<div class="overlay" id="detailOverlay">
  <div class="panel" id="detailPanel"></div>
</div>

<!-- Export overlay -->
<div class="overlay" id="exportOverlay">
  <div class="panel" style="max-width:440px;">
    <div class="panel-head">
      <h2>📊 匯出 Excel</h2>
      <button class="close" data-close="exportOverlay">×</button>
    </div>
    <div class="hint">選擇要匯出的內容，會產生一份 .xlsx 檔案下載到你的裝置（匯出全部商案，不受目前搜尋/篩選影響）。</div>
    <label class="checkline"><input type="checkbox" id="expSummary" checked> 總覽總表（所有商案一覽表，一列一筆）</label>
    <label class="checkline"><input type="checkbox" id="expDetail" checked> 各商演詳細資料（每個商案各一個分頁，含舞者/服裝/排練/曲目）</label>
    <div class="status-line" id="exportStatus"></div>
    <div class="actions">
      <button class="btn btn-ghost" data-close="exportOverlay">取消</button>
      <button class="btn btn-primary" id="btnDoExport">開始匯出</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const STORAGE_KEY = 'flyingspace-projects';
let projects = [];
let selectedIds = new Set();

function uid(){ return 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }

function blankProject(){
  return {
    id: uid(), title:'新商案', client:'', performDate:'', location:'', status:'籌備中', travelNote:'', costumeStyle:'',
    leadChoreo:[], dancers:[], costumes:[], rehearsals:[], setlist:[], flights:[], advances:[]
  };
}

async function loadProjects(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    projects = raw ? JSON.parse(raw) : [];
  }catch(e){
    console.error('讀取失敗', e);
    projects = [];
  }
  render();
}
async function saveProjects(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(projects));
    return true;
  }catch(e){
    console.error('儲存失敗', e);
    showToast('⚠️ 資料儲存失敗（瀏覽器儲存空間可能已滿或被封鎖），建議立即用「📊 匯出 Excel」備份目前的資料。');
    return false;
  }
}

function showToast(msg){
  let t = document.getElementById('toast');
  if(!t){
    t = document.createElement('div');
    t.id='toast';
    t.style.cssText = 'position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--danger-soft); color:var(--danger); border:1px solid var(--danger); padding:12px 18px; border-radius:10px; font-size:13.5px; max-width:520px; z-index:200; box-shadow:0 8px 24px rgba(0,0,0,0.4);';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.display='block';
  clearTimeout(t._hideTimer);
  t._hideTimer = setTimeout(()=>{ t.style.display='none'; }, 8000);
}

const STATUS_LIST = ['籌備中','估價中','已確認','已演出','已寄發票','已入帳','已請款','已結案','已取消'];
function statusClass(s){
  if(s==='已取消') return 'st-cancel';
  if(['已寄發票','已入帳','已請款','已結案'].includes(s)) return 'st-done';
  if(['已確認','已演出'].includes(s)) return 'st-ready';
  return 'st-pending'; // 籌備中, 估價中
}

let currentView = 'cards';

function populateFilterOptions(){
  const clientSel = document.getElementById('clientFilter');
  const yearSel = document.getElementById('yearFilter');
  const monthSel = document.getElementById('monthFilter');
  const curClient = clientSel.value, curYear = yearSel.value, curMonth = monthSel.value;

  const clients = [...new Set(projects.map(p=>p.client).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-Hant'));
  const years = [...new Set(projects.map(p=>p.performDate).filter(Boolean).map(d=>d.slice(0,4)))].sort();
  const months = [...new Set(projects.map(p=>p.performDate).filter(Boolean).map(d=>d.slice(5,7)))].sort();

  clientSel.innerHTML = '<option value="">全部客戶</option>' + clients.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
  yearSel.innerHTML = '<option value="">全部年份</option>' + years.map(y=>`<option value="${y}">${y}年</option>`).join('');
  monthSel.innerHTML = '<option value="">全部月份</option>' + months.map(m=>`<option value="${m}">${parseInt(m,10)}月</option>`).join('');

  if(clients.includes(curClient)) clientSel.value = curClient;
  if(years.includes(curYear)) yearSel.value = curYear;
  if(months.includes(curMonth)) monthSel.value = curMonth;
}

function getFilteredList(){
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  const sf = document.getElementById('statusFilter').value;
  const cf = document.getElementById('clientFilter').value;
  const yf = document.getElementById('yearFilter').value;
  const mf = document.getElementById('monthFilter').value;
  let list = projects.filter(p=>{
    if(sf && p.status !== sf) return false;
    if(cf && p.client !== cf) return false;
    if(yf && (!p.performDate || p.performDate.slice(0,4) !== yf)) return false;
    if(mf && (!p.performDate || p.performDate.slice(5,7) !== mf)) return false;
    if(!q) return true;
    const hay = [p.title,p.client,p.location, (p.dancers||[]).map(d=>d.performing+d.original).join(' ')].join(' ').toLowerCase();
    return hay.includes(q);
  });
  list.sort((a,b)=> (a.performDate||'').localeCompare(b.performDate||''));
  return list;
}

function render(){
  const validIds = new Set(projects.map(p=>p.id));
  [...selectedIds].forEach(id=>{ if(!validIds.has(id)) selectedIds.delete(id); });
  updateBulkBar();
  populateFilterOptions();
  const list = getFilteredList();
  document.getElementById('grid').style.display = currentView==='cards' ? 'grid' : 'none';
  document.getElementById('listWrap').style.display = currentView==='list' ? 'block' : 'none';
  if(currentView==='cards') renderCards(list); else renderList(list);
}

function renderCards(list){
  const grid = document.getElementById('grid');
  if(list.length===0){
    grid.innerHTML = `<div class="empty"><b>目前沒有商案資料</b>貼上備忘錄或手動新增，開始建立你的商案總覽。</div>`;
    return;
  }
  grid.innerHTML = list.map(p=>{
    const dCount = (p.dancers||[]).length;
    const sCount = (p.setlist||[]).length;
    return `<div class="card" data-id="${p.id}">
      <label class="card-check"><input type="checkbox" data-check="${p.id}" ${selectedIds.has(p.id)?'checked':''}></label>
      <div class="top">
        <h3>${esc(p.title||'未命名商案')}</h3>
        <span class="stamp ${statusClass(p.status)}">${esc(p.status||'籌備中')}</span>
      </div>
      <div class="meta">
        <div>客戶／主辦：<b>${esc(p.client||'—')}</b></div>
        <div>演出日期：<b>${esc(p.performDate||'—')}</b>　地點：<b>${esc(p.location||'—')}</b></div>
        ${p.travelNote? `<div>${esc(p.travelNote)}</div>`:''}
      </div>
      <div class="stats"><span>舞者 <em>${dCount}</em></span><span>曲目 <em>${sCount}</em></span></div>
    </div>`;
  }).join('');

  grid.querySelectorAll('.card').forEach(c=>{
    c.addEventListener('click', (e)=>{
      if(e.target.closest('.card-check')) return;
      openDetail(c.dataset.id);
    });
  });
  grid.querySelectorAll('[data-check]').forEach(cb=>{
    cb.addEventListener('click', e=>e.stopPropagation());
    cb.addEventListener('change', ()=>{
      toggleSelect(cb.dataset.check, cb.checked);
    });
  });
}

function renderList(list){
  const body = document.getElementById('listBody');
  if(list.length===0){

    return;

  const statuses = STATUS_LIST;
  body.innerHTML = list.map(p=>{
    const dCount = (p.dancers||[]).length;
    const dancerNames = (p.dancers||[]).map(d=>d.performing||d.original).filter(Boolean).join('、');
    return `<tr data-id="${p.id}">
      <td><input type="checkbox" data-check="${p.id}" ${selectedIds.has(p.id)?'checked':''}></td>
      <td class="title-col" contenteditable="true" data-f="title">${esc(p.title)}</td>
      <td><select class="stamp ${statusClass(p.status)}" data-f="status">${statuses.map(s=>`<option value="${s}" ${p.status===s?'selected':''}>${s}</option>`).join('')}</select></td>
      <td contenteditable="true" data-f="location">${esc(p.location)}</td>
      <td contenteditable="true" data-f="performDate">${esc(p.performDate)}</td>
      <td contenteditable="true" data-f="travelNote">${esc(p.travelNote)}</td>
      <td contenteditable="true" data-f="client">${esc(p.client)}</td>
      <td class="num">${dCount}</td>
      <td class="dancer-col" title="${esc(dancerNames)}">${esc(dancerNames||'—')}</td>
      <td contenteditable="true" data-f="costumeStyle">${esc(p.costumeStyle)}</td>
      <td><button class="detail-link" data-open="${p.id}">詳情 →</button></td>
    </tr>`;
  }).join('');

  body.querySelectorAll('[data-check]').forEach(cb=>{
    cb.addEventListener('change', ()=> toggleSelect(cb.dataset.check, cb.checked));
  });
  body.querySelectorAll('td[contenteditable]').forEach(td=>{
    td.addEventListener('blur', ()=>{
      const id = td.closest('tr').dataset.id;
      const p = projects.find(x=>x.id===id);
      if(p){ p[td.dataset.f] = td.textContent.trim(); saveProjects(); }
    });
  });
  body.querySelectorAll('select.stamp').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const id = sel.closest('tr').dataset.id;
      const p = projects.find(x=>x.id===id);
      if(p){ p.status = sel.value; saveProjects(); render(); }
    });
  });
  body.querySelectorAll('[data-open]').forEach(btn=>{
    btn.addEventListener('click', ()=> openDetail(btn.dataset.open));
  });
}

function toggleSelect(id, checked){
  if(checked) selectedIds.add(id); else selectedIds.delete(id);
  updateBulkBar();
  // 同步同一個id在另一個視圖(卡片/列表)裡的checkbox狀態，不必整個render重繪
  document.querySelectorAll(`[data-check="${id}"]`).forEach(cb=> cb.checked = checked);
  const selectAllList = document.getElementById('selectAllList');
  if(selectAllList){
    const boxes = document.querySelectorAll('#listBody [data-check]');
    selectAllList.checked = boxes.length>0 && [...boxes].every(b=>b.checked);
  }
}

function updateBulkBar(){
  const bar = document.getElementById('bulkBar');

  bar.style.display = count>0 ? 'flex' : 'none';

      </tbody>
    </table>
    <button class="row-add" data-add="${key}">+ 新增一列</button>
  </div>`;
}
function rowHTML(fields, r, i){
  return `<tr data-i="${i}">${fields.map(f=>`<td contenteditable="true" data-f="${f}">${esc(r[f])}</td>`).join('')}<td><button class="rm-btn" data-rm="${i}">✕</button></td></tr>`;

function bindDetailEvents(p){
  const panel = document.getElementById('detailPanel');
  panel.querySelectorAll('[data-close]').forEach(b=> b.addEventListener('click', ()=>closeOverlay(b.dataset.close)));

  panel.querySelectorAll('.top-fields [data-f]').forEach(el=>{

  });

  panel.querySelectorAll('.sec').forEach(sec=>{
    const key = sec.dataset.sec;
    sec.querySelectorAll('td[contenteditable]').forEach(td=>{
      td.addEventListener('blur', ()=>{
        const i = parseInt(td.closest('tr').dataset.i);
        p[key][i][td.dataset.f] = td.textContent.trim();
      });
    });
    sec.querySelectorAll('[data-rm]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const i = parseInt(btn.dataset.rm);
        p[key].splice(i,1);
        refreshSection(sec, key, p);
      });
    });
  });

  panel.querySelectorAll('[data-add]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const key = btn.dataset.add;
      const fieldsMap = {
        leadChoreo:['person','role','hours','fee','note'],
        dancers:['original','performing','fee','confirmStatus','note'],
        costumes:['dancer','item','size','qty','method','status','returnDate','note'],
        rehearsals:['activity','date','start','end','place','hours','fee','present','absent','status','note'],
        setlist:['order','song','duration','note'],
        flights:['type','date','flightNo','from','depTime','to','arrTime','person','note'],
        advances:['item','amount','payer','date','note']
      };
      const blank = {}; fieldsMap[key].forEach(f=>blank[f]='');
      p[key].push(blank);
      refreshSection(btn.closest('.sec'), key, p);
    });
  });

  const delBtn = document.getElementById('btnDelete');
  let delArmed = false;
  let delTimer = null;
  delBtn.addEventListener('click', ()=>{
    if(!delArmed){
      delArmed = true;
      delBtn.textContent = '再按一次確認刪除';
      delBtn.style.color = 'var(--danger)';
      delBtn.style.borderColor = 'var(--danger)';
      delTimer = setTimeout(()=>{
        delArmed = false;
        delBtn.textContent = '刪除此商案';
        delBtn.style.color = '';
        delBtn.style.borderColor = '';
      }, 4000);
      return;
    }
    clearTimeout(delTimer);
    projects = projects.filter(x=>x.id!==p.id);
    saveProjects(); render(); closeOverlay('detailOverlay');
  });
  document.getElementById('btnSaveDetail').addEventListener('click', ()=>{
    saveProjects(); render(); closeOverlay('detailOverlay');
  });
}

const NICKNAME_MAP = {
  '美艷':'周映孜', '貝拉':'謝雨彤', '宜欣':'林宜欣', '岱凌':'吳岱凌', '安妮':'張安妮'
};
function normalizeName(n){
  n = (n||'').trim();
  if(!n) return n;
  return NICKNAME_MAP[n] || n;
}

function splitDancerList(str){
  return str.split(/[、,，]/).map(s=>s.trim()).filter(Boolean).map(entry=>{
    // 格式：演出舞者(原舞者) 或 演出舞者（頂原舞者），括號內不一定有「頂」字
    const m = entry.match(/^(.+?)[\(（]\s*頂?\s*([^\)）]+?)\s*[\)）]\s*$/);
    let performing, original;
    if(m){
      performing = m[1].trim();
      original = m[2].trim();
    } else {
      performing = entry;
      original = entry;
    }
    performing = normalizeName(performing);
    original = normalizeName(original);
    return {original, performing, fee:'', confirmStatus:'', note:''};
  });
}

function parseMemoBlockLocal(text){
  text = text.replace(/^\s*✨/, '').trim();
  const stripInvisible = s => s.replace(/[\u200B\u200C\u200D\u2060\uFEFF]/g,'');
  const lines = text.split(/\n/).map(l=>stripInvisible(l).trim()).filter(l=>l.length>0);
  const p = blankProject();
  if(lines.length===0) throw new Error('這個區塊沒有內容可以解析');

  // ---- 第一行：標題 + 可能同行帶的預留備註 ----
  let firstLine = lines[0];
  let travelNote = '';
  const parenInline = firstLine.match(/^(.*?)[\(（]([^)）]*)[\)）](.*)$/);
  if(parenInline){
    p.title = parenInline[1].trim();
    travelNote = ('('+parenInline[2]+')'+parenInline[3]).trim();
  } else {
    p.title = firstLine;
  }
  const dm = p.title.match(/(\d{1,2})[\/月](\d{1,2})/);
  if(dm){
    p.performDate = `2026-${dm[1].padStart(2,'0')}-${dm[2].padStart(2,'0')}`;
  }
  let locGuess = p.title.replace(/\d{1,2}[\/月]\d{1,2}日?/g,'').trim();
  locGuess = locGuess.replace(/(商演|商案)\s*$/,'').trim();
  if(locGuess) p.location = locGuess;

  let idx = 1;
  if(!travelNote && lines[1] && /^[\(（]/.test(lines[1])){
    travelNote = lines[1];
    idx = 2;
  }
  p.travelNote = travelNote;

  let mode = null;
  for(; idx<lines.length; idx++){
    let line = lines[idx];

    if(/^舞者[:：]/.test(line)){
      p.dancers = splitDancerList(line.replace(/^舞者[:：]/,''));
      mode = null;
      continue;
    }
    if(/^(演出)?曲目[:：]?\s*$/.test(line)){ mode='setlist'; continue; }
    const rehHeading = line.match(/^排練(?:日期|時間)[:：]?\s*(.*)$/);
    if(rehHeading){
      if(!rehHeading[1] || rehHeading[1]==='無'){ continue; }
      line = rehHeading[1]; // 剝掉「排練日期：」前綴，剩下內容繼續往下當排練時間解析
    }
    const advanceMatch = line.match(/^代墊[:：]\s*(.+)$/);
    if(advanceMatch){
      let content = advanceMatch[1].trim();
      const amountMatch = content.match(/([\d,]+(?:\.\d+)?)\s*元/);
      const amount = amountMatch ? amountMatch[1] : '';
      let payer = '';
      const payerMatch = content.match(/([^\s()（）,，。]{1,6}?)(?:已付款|已墊付|已代墊|墊付|代墊|墊|付款|付)/);
      if(payerMatch){ payer = normalizeName(payerMatch[1]); }
      const noteParts = [];
      content = content.replace(/[\(（]([^)）]+)[\)）]/g, (m, inner)=>{ noteParts.push(inner.trim()); return ' '; });
      if(amountMatch){ content = content.replace(amountMatch[0],' '); }
      content = content.replace(/\s+/g,' ').trim();
      p.advances.push({item:content, amount, payer, date:'', note:noteParts.join('；')});
      continue;
    }
    const songMatch = line.match(/^(\d+)[.\uFF0E、]\s*(.+)$/);
    if(songMatch){
      let content = songMatch[2];
      let song = content, note = '';
      const noteIdx = content.search(/備註[:：]/);
      if(noteIdx>=0){
        song = content.slice(0, noteIdx).trim();
        note = content.slice(noteIdx).replace(/^備註[:：]\s*/,'').trim();
      }
      song = song.replace(/✅/g,'').trim();
      p.setlist.push({order:songMatch[1], song, duration:'', note});
      continue;
    }
    if(/^演出服裝/.test(line)){
      p.costumeStyle = line.replace(/^演出服裝[:：]?/,'').trim();
      continue;
    }
    if(/^編排[:：]/.test(line)){
      let content = line.replace(/^編排[:：]\s*/,'');
      let person = '';
      const pm = content.match(/編排者\s*([^\s，,。]+)/);
      if(pm){ person = normalizeName(pm[1]); content = content.replace(pm[0],'').trim(); }
      p.leadChoreo.push({person, role:content, hours:'', fee:'', note:''});
      continue;
    }
    const timeMatch = line.match(/(\d{1,2}):?(\d{2})\s*[-~]\s*(\d{1,2}):?(\d{2})/);
    if(timeMatch){
      const startStr = `${timeMatch[1].padStart(2,'0')}:${timeMatch[2]}`;
      const endStr = `${timeMatch[3].padStart(2,'0')}:${timeMatch[4]}`;
      let date='';
      const dmm = line.match(/(\d{1,2})[\/月](\d{1,2})/);
      if(dmm){ date = `2026-${dmm[1].padStart(2,'0')}-${dmm[2].padStart(2,'0')}`; }
      let rest = line.replace(timeMatch[0],'');
      if(dmm) rest = rest.replace(dmm[0],'');
      rest = rest.replace(/週[一二三四五六日天]/,'').replace(/^日?/,'').trim();

      let present='', absent='', note='';
      const absentM = rest.match(/[\(（]?\s*缺\s*([^\s，,。\)）]+)\s*[\)）]?/);
      if(absentM){ absent = normalizeName(absentM[1]); rest = rest.replace(absentM[0],'').trim(); }
      if(/全到|全員到齊|全員/.test(rest)){ present='全員'; rest = rest.replace(/全到|全員到齊|全員/,'').trim(); }
      const trailNote = rest.match(/[\(（]([^)）]+)[\)）]\s*$/);
      if(trailNote){ note = trailNote[1].trim(); rest = rest.replace(trailNote[0],'').trim(); }
      // 純粹的時數說明(如 1.5hr／2hr)不是地點，直接清掉，時數會自動用開始結束時間算
      if(/^\d+(\.\d+)?\s*(hr|hrs|小時)$/i.test(rest)){ rest = ''; }

      // 從尾端擷取含英數字的「地點/教室」token，其餘視為活動項目
      const tokens = rest.split(/\s+/).filter(Boolean);
      const placeTokens = [];
      while(tokens.length && /[A-Za-z]/.test(tokens[tokens.length-1])){
        placeTokens.unshift(tokens.pop());
      }
      const place = placeTokens.join(' ');
      const activity = tokens.join(' ');

      const [sh,sm] = startStr.split(':').map(Number);
      const [eh,em] = endStr.split(':').map(Number);
      let diff = (eh*60+em) - (sh*60+sm);
      if(diff<=0) diff += 24*60;
      const hours = (Math.round(diff/60*10)/10).toString();

      p.rehearsals.push({activity, date, start:startStr, end:endStr, place, hours, fee:'', present, absent, status:'已排定', note});
      continue;
    }
    const flightMatch = line.match(/^(.*?)(?:從|由)\s*([^\s]+?)\s*(?:飛|搭機到|搭機至|飛往)\s*([^\s，,。]+)/);
    if(flightMatch){
      let personPart = flightMatch[1].trim();
      const dmm2 = personPart.match(/(\d{1,2})[\/月](\d{1,2})/);
      let date = '';
      if(dmm2){ date = `2026-${dmm2[1].padStart(2,'0')}-${dmm2[2].padStart(2,'0')}`; personPart = personPart.replace(dmm2[0],'').trim(); }
      personPart = personPart.replace(/^日?[:：,，]?\s*/,'').trim();
      const person = personPart.split(/[、,，]/).map(s=>normalizeName(s.trim())).filter(Boolean).join('、');
      p.flights.push({type:'去程', date, flightNo:'', from:flightMatch[2].trim(), depTime:'', to:flightMatch[3].trim(), arrTime:'', person, note:''});
      continue;
    }
    const unavailMatch = line.match(/^不行[:：]\s*(.+)$/);
    if(unavailMatch){
      const names = unavailMatch[1].split(/[、,，]/).map(s=>normalizeName(s.trim())).filter(Boolean).join('、');
      p.travelNote = p.travelNote ? (p.travelNote + '｜不行：' + names) : ('不行：' + names);
      continue;
    }
    // 無法歸類的行，附加在行程備註後面，避免資料遺失
    p.travelNote = p.travelNote ? (p.travelNote + '｜' + line) : line;
  }
  p.travelNote = p.travelNote.replace(/[\(\)（）]/g,'').trim();
  return p;
}

document.getElementById('btnParse').addEventListener('click', ()=>{
  const raw = document.getElementById('quickText').value.trim();
  const statusEl = document.getElementById('quickStatus');
  if(!raw){ statusEl.className='status-line err'; statusEl.textContent='請先貼上備忘錄內容。'; return; }

  let blocks = raw.split(/(?=✨)/).map(b=>b.trim()).filter(Boolean);
  if(blocks.length===0) blocks=[raw];

  let ok=0, fail=0, firstErr='';
  blocks.forEach(block=>{
    try{
      const p = parseMemoBlockLocal(block);
      projects.push(p);
      ok++;
    }catch(e){
      console.error(e);
      if(!firstErr) firstErr = e.message || String(e);
      fail++;
    }
  });
  saveProjects();
  render();
  statusEl.className = fail? 'status-line err':'status-line ok';
  statusEl.textContent = `完成：成功解析 ${ok} 筆${fail? '，失敗 '+fail+' 筆（原因：'+firstErr+'，可手動新增補上）':''}。`;
  if(ok>0 && fail===0){
    setTimeout(()=>{ closeOverlay('quickOverlay'); }, 900);
  }
});

/* ---------- Excel export ---------- */
function sanitizeSheetName(name, used){
  let n = (name||'工作表').toString().replace(/[:\\\/\?\*\[\]]/g,'-').trim().slice(0,31);
  if(!n) n='工作表';
  let base=n, i=1, finalName=n;
  while(used.has(finalName)){
    const suffix='_'+i;
    finalName = base.slice(0, 31-suffix.length)+suffix;
    i++;
  }
  used.add(finalName);
  return finalName;
}

function buildSummarySheet(list){
  const header = ['商演名稱','狀態','演出地點','活動日期','預留日期','客戶','人數','演出舞者','演出服裝樣式'];
  const rows = list.map(p=>{
    const dancerNames = (p.dancers||[]).map(d=>d.performing||d.original).filter(Boolean).join('、');
    return [p.title||'', p.status||'', p.location||'', p.performDate||'', p.travelNote||'', p.client||'', (p.dancers||[]).length, dancerNames, p.costumeStyle||''];
  });
  return XLSX.utils.aoa_to_sheet([header, ...rows]);
}

function buildDetailSheet(p){
  const aoa = [];
  aoa.push(['商演名稱', p.title||'']);
  aoa.push(['客戶/主辦單位', p.client||'', '演出日期', p.performDate||'', '演出地點', p.location||'', '商案狀態', p.status||'']);
  aoa.push(['預留日期/行程備註', p.travelNote||'', '演出服裝樣式', p.costumeStyle||'']);
  aoa.push([]);
  function section(title, headers, fields, rows){
    aoa.push([title]);
    aoa.push(headers);
    (rows||[]).forEach(r=> aoa.push(fields.map(f=> r[f]||'')));
    aoa.push([]);
  }
  section('去程／回程班機', ['類型','日期','航班編號','出發地','出發時間','抵達地','抵達時間','人員','備註'], ['type','date','flightNo','from','depTime','to','arrTime','person','note'], p.flights);
  section('代墊', ['項目','金額','墊付人','日期','備註'], ['item','amount','payer','date','note'], p.advances);
  section('帶隊編舞', ['人員','帶隊/編舞','時數','費用','備註'], ['person','role','hours','fee','note'], p.leadChoreo);
  section('舞者名單', ['原始舞者','演出舞者','舞者費用','確認接演狀態','備註'], ['original','performing','fee','confirmStatus','note'], p.dancers);
  section('演出服裝', ['舞者','品項','尺寸','數量','取得方式','服飾狀態','歸還日期','備註'], ['dancer','item','size','qty','method','status','returnDate','note'], p.costumes);
  section('活動排練時間', ['活動項目','日期','開始','結束','地點/教室','時數','費用','需到場舞者','缺席人員','狀態','備註'], ['activity','date','start','end','place','hours','fee','present','absent','status','note'], p.rehearsals);
  section('演出曲目', ['順序','歌曲名稱','時長','備註'], ['order','song','duration','note'], p.setlist);
  return XLSX.utils.aoa_to_sheet(aoa);
}

document.getElementById('btnExport').addEventListener('click', ()=>{
  document.getElementById('exportStatus').textContent='';
  document.getElementById('exportOverlay').classList.add('show');
});

document.getElementById('btnDoExport').addEventListener('click', ()=>{
  const statusEl = document.getElementById('exportStatus');
  const wantSummary = document.getElementById('expSummary').checked;
  const wantDetail = document.getElementById('expDetail').checked;
  if(!wantSummary && !wantDetail){
    statusEl.className='status-line err'; statusEl.textContent='請至少選擇一種內容。'; return;
  }
  if(typeof XLSX === 'undefined'){
    statusEl.className='status-line err'; statusEl.textContent='Excel 匯出功能載入失敗，請檢查網路連線後重新整理頁面再試一次。'; return;
  }
  const sortedAll = [...projects].sort((a,b)=> (a.performDate||'').localeCompare(b.performDate||''));
  if(sortedAll.length===0){
    statusEl.className='status-line err'; statusEl.textContent='目前沒有商案資料可以匯出。'; return;
  }
  try{
    const wb = XLSX.utils.book_new();
    const used = new Set();
    if(wantSummary){
      const name = sanitizeSheetName('總覽總表', used);
      XLSX.utils.book_append_sheet(wb, buildSummarySheet(sortedAll), name);
    }
    if(wantDetail){
      sortedAll.forEach(p=>{
        const name = sanitizeSheetName(p.title, used);
        XLSX.utils.book_append_sheet(wb, buildDetailSheet(p), name);
      });
    }
    const today = new Date().toISOString().slice(0,10);
    XLSX.writeFile(wb, `Flyingspace商案匯出_${today}.xlsx`);
    statusEl.className='status-line ok'; statusEl.textContent='匯出完成，請查看下載的檔案。';
    setTimeout(()=>{ closeOverlay('exportOverlay'); }, 1000);
  }catch(e){
    console.error(e);
    statusEl.className='status-line err'; statusEl.textContent='匯出失敗：'+(e.message||e);
  }
});
